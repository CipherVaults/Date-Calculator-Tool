[package]
name = "date-calculator-tool"
version = "1.2.0"
edition = "2021"
description = "Offline desktop date calculator built with Tauri and Rust."
authors = ["Mohamed Sayed", "Ahmed Emara", "Claude"]
license = "UNLICENSED"
publish = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
date-core = { path = "../crates/date-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-clipboard-manager = "2"
